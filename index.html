<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#1f1b16">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Therzie Mods Wiki</title>
  <meta name="description" content="Items, recipes, build pieces, creatures and locations from Therzie's Valheim mods: Armory, Warfare, Monstrum and Wizardry.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Therzie Mods Wiki</a>
    <nav class="tabs" id="tabs">
      <a href="#/items" data-tab="items">Items</a>
      <a href="#/pieces" data-tab="pieces">Pieces</a>
      <a href="#/creatures" data-tab="creatures">Creatures</a>
      <a href="#/locations" data-tab="locations">Locations</a>
    </nav>
    <input id="search" type="search" placeholder="Search everything…" autocomplete="off" aria-label="Search">
    <label class="theme">Theme
      <select id="theme" aria-label="Theme">
        <option value="auto">Match system</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <footer class="footer" id="footer"></footer>
  <script src="assets/app.js"></script>
</body>
</html>
